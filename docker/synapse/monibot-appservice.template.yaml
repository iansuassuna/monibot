# MoniBot application service: receives MatrixRTC call memberships from every room so the API can
# dispatch the tutor agent, and owns the students' accounts. Tokens are filled from env by start.sh.
id: monibot
url: "__MONIBOT_API_URL__"
as_token: "__MATRIX_AS_TOKEN__"
hs_token: "__MATRIX_HS_TOKEN__"
sender_localpart: monibot
rate_limited: false
namespaces:
  users:
    - exclusive: true
      regex: "@monibot:localhost"
    # Students' Matrix accounts, created and logged in by the API (no self-registration).
    - exclusive: true
      regex: "@aluno-[a-z0-9-]+:localhost"
  rooms:
    - exclusive: false
      regex: ".*"
  aliases: []
